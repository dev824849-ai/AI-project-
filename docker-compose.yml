version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polaris-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./polaris.db
      - SECRET_KEY=${SECRET_KEY}
      
    volumes:
      - ./backend/polaris.db:/app/polaris.db
      - ./backend/app/ml/models:/app/app/ml/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polaris-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
